<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechWorld | Secure Dashboard</title>

    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,800" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- AUTH VIEW -->
<div id="auth-view" class="view-section active">
    <div class="container" id="main-container">

        <!-- SIGN UP -->
        <div class="form-container sign-up-container">
            <form id="signUpForm">
                <h1>Create Account</h1>
                <input type="text" id="upName" placeholder="Name" required>
                <input type="email" id="upEmail" placeholder="Email" required>
                <input type="password" id="upPassword" placeholder="Password" required>
                <button type="submit">Sign Up</button>
            </form>
        </div>

        <!-- SIGN IN -->
        <div class="form-container sign-in-container">
            <form id="signInForm">
                <h1>Sign In</h1>
                <input type="email" id="inEmail" placeholder="Email" required>
                <input type="password" id="inPassword" placeholder="Password" required>
                <button type="submit">Sign In</button>
            </form>
        </div>

        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <h1>Welcome Back!</h1>
                    <button class="ghost" id="signInToggle">Sign In</button>
                </div>
                <div class="overlay-panel overlay-right">
                    <h1>Hello, Friend!</h1>
                    <button class="ghost" id="signUpToggle">Sign Up</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- DASHBOARD VIEW -->
<div id="dashboard-view" class="view-section">
    <nav class="navbar">
        <div class="logo">TECHWORLD</div>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </nav>

    <div class="dashboard-content">
        <div class="welcome-box">
            <h2>Welcome, <span id="display-name-label">User</span></h2>
            <p id="user-email-display"></p>
        </div>

        <!-- DEMO CARD SYSTEM -->
        <div class="card-box">
            <h2>Add Demo Telda Card</h2>
            <form id="addCardForm">
                <input type="text" id="cardHolder" placeholder="Card Holder Name" required>
                <input type="text" id="cardNumber" placeholder="Demo Card Number" required>
                <button type="submit">Save Card</button>
            </form>

            <h3>Your Cards</h3>
            <ul id="cardsList"></ul>
        </div>
    </div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

<script src="script.js"></script>
</body>
</html>
